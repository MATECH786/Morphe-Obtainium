enable-module-update = true
parallel-jobs = 1
compression-level = 9
include-stock = "split"
riplib = true
cli-version = "dev"

[YouTube]
enable = true
patches-source = "anddea/revanced-patches"
patches-version = "dev"
cli-source = "MorpheApp/morphe-cli"
cli-version = "dev"
app-name = "YouTube"
build-mode = "both"#both means packing both apk and module at the same time. To pack only mask module, change both to module
version = "auto"#Remember to check the patch support version before each package
rv-brand = "ReVanced Extended"
#Remember to change these two versions when the patch is updated
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube/"
#archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
excluded-patches = "'Custom branding name for YouTube'"#Exclusion list
included-patches = "'Custom header for YouTube'"#Mandatory inclusion list Patches have a default list, some are disabled by default
patcher-args = " -e 'MaterialYou' -e 'Return YouTube Username' -e'Custom branding icon for YouTube' -OappIcon='mmt_turquoise' -OchangeSplashIcon='true' -OrestoreOldSplashAnimation='true' -e 'Visual preferences icons for YouTube' -OsettingsMenuIcon='yt_alt' -OapplyToAll='true' -e 'Custom header for YouTube' -OcustomHeader='custom_branding_icon' -e 'Theme' -OdarkThemeBackgroundColor=@android:color/black -e 'Settings for YouTube' -OrvxSettingsLabel='Revanced Extended' -OinsertPosition=@string/about_key"

[YouTube-Morphe]
enable = true
app-name = "YouTube"
brand = "Morphe"
build-mode = "both"
excluded-patches = "'Custom branding'"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
version = "latest"

[YouTube-Music-Morphe]
enable = true
app-name = "YouTube Music"
brand = "Morphe"
build-mode = "both"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
version = "latest"

[Reddit-Morphe]
enable = true
app-name = "Reddit"
brand = "Morphe"
build-mode = "both"
uptodown-dlurl = "https://reddit-official-app.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit/"
version = "latest"

[X-Piko]
enable = true
app-name = "X"
brand = "Piko"
pkg-name = "com.twitter.android"
build-mode = "apk"
uptodown-dlurl = "https://twitter.en.uptodown.com/android"
apkmirror-dlurl = "https://apkmirror.com/apk/x-corp/twitter"
version = "latest"
patches-source = "crimera/piko"
patches-version = "dev"

[Instagram-Piko]
enable = true
app-name = "Instagram"
brand = "Piko"
pkg-name = "com.instagram.android"
build-mode = "apk"
uptodown-dlurl = "https://instagram.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
direct-dlurl = "https://github.com/krvstek/uni-storage/releases/download/instagram/com.instagram.android-439.0.0.37.89-arm64-v8a.apkm"
version = "439.0.0.37.89"
patches-source = "crimera/piko"
patches-version = "dev"
